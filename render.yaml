services:
  # Backend API Server
  - type: web
    name: invoice-import-server
    runtime: bun
    plan: free
    region: oregon
    rootDir: server
    buildCommand: bun install && bun run db:generate && bun run build
    startCommand: bun run start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false

  # Frontend Web Client (Static Site)
  - type: static
    name: invoice-import-client
    rootDir: client
    buildCommand: bun install && bun run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
